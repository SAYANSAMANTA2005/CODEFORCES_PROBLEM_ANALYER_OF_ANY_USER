<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codeforces_Problem_Analysier</title>
</head>
<body>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f6f6f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 32px 40px 40px 40px;
        }
        form {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #bbb;
            font-size: 1rem;
            width: 260px;
            transition: border 0.2s;
        }
        input[type="text"]:focus {
            border: 1.5px solid #0077ff;
            outline: none;
        }
        button {
            padding: 10px 22px;
            border-radius: 6px;
            border: none;
            background: #0077ff;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #005fcc;
        }
        h1 {
            color: #fff;
            background: #b22222;
            padding: 18px 0 18px 18px;
            border-radius: 8px 8px 0 0;
            margin: 0 0 10px 0;
            font-size: 2.1rem;
            letter-spacing: 1px;
        }
        #cnt {
            color: #222;
            margin: 10px 0 0 0;
            font-size: 1.2rem;
            font-weight: 500;
        }
        #tagsList {
            color: #6a1b9a;
            background: #ececec;
            border-radius: 0 0 8px 8px;
            padding: 24px 24px 24px 32px;
            margin: 0;
            min-height: 200px;
            font-size: 1.08rem;
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px 5vw;
            }
            h1 {
                font-size: 1.2rem;
                padding: 10px 0 10px 10px;
            }
            #tagsList {
                padding: 10px 10px 10px 15px;
                font-size: 0.98rem;
            }
        }
    </style>
    <div class="container">
        <form>
            <input type="text" placeholder="Enter Your CodeForces Handle" id="handle" required>
            <button type="submit" id="btn">Analyze</button>
        </form>
        <h1>Problem Tags and their counts:</h1>
        <h3 id="cnt">Loading...</h3>
        <ul id="tagsList">Content</ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
